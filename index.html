<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Caps - test 3</title>
<style>
body { font-family: -apple-system, sans-serif; padding: 1em; font-size: 14px; }
#log { white-space: pre-wrap; background: #f0f0f0; padding: 1em; border-radius: 8px; }
.ok { color: green; }
.err { color: red; }
.info { color: #555; }
</style>
</head>
<body>
<h1>Caps - test 3 : log local</h1>
<div id="log">Chargement...</div>
<script>
const CODE = "kZf66iZydKuIwvpnOJNRuYtpu244mXTHgPk";
const API = "https://eapi.pcloud.com";
const LOG_LOCAL = "log_caps_251010_09_58_Bel_Bien ensemble.txt";

const log = document.getElementById("log");
function ecrire(msg, classe) {
  const d = document.createElement("div");
  if (classe) d.className = classe;
  d.textContent = msg;
  log.appendChild(d);
}

const FETCH_OPTS = { referrerPolicy: "no-referrer" };

function parserLog(texte) {
  const tc = {};
  const re = /(\S+\.(?:jpg|jpeg|png))\s+\(\d+x\d+px,\s*t=(?:(\d+)h)?(\d+)m(\d+)s/i;
  for (const ligne of texte.split('\n')) {
    const m = ligne.match(re);
    if (m) {
      const nom = m[1];
      const h = m[2] ? parseInt(m[2]) : 0;
      const mn = parseInt(m[3]);
      const s = parseInt(m[4]);
      tc[nom] = h * 3600 + mn * 60 + s;
    }
  }
  return tc;
}

function formaterTC(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}h${String(m).padStart(2,'0')}m${String(sec).padStart(2,'0')}s`;
  return `${m}m${String(sec).padStart(2,'0')}s`;
}

async function test() {
  log.textContent = "";
  try {
    ecrire("1. Lecture du log local (depuis GitHub Pages)...");
    const r1 = await fetch(LOG_LOCAL);
    if (!r1.ok) throw new Error("HTTP " + r1.status + " sur le log local. Verifier le nom du fichier.");
    const texteLog = await r1.text();
    ecrire("   OK : " + texteLog.length + " caracteres", "ok");
    
    ecrire("2. Parsing des timestamps...");
    const tc = parserLog(texteLog);
    const noms = Object.keys(tc);
    ecrire("   OK : " + noms.length + " timestamps extraits", "ok");
    
    ecrire("3. Appel showpublink (pCloud)...");
    const r2 = await fetch(`${API}/showpublink?code=${CODE}`, FETCH_OPTS);
    const j2 = await r2.json();
    if (j2.result !== 0) throw new Error("showpublink result=" + j2.result);
    ecrire("   OK", "ok");
    
    const dossierCaps = j2.metadata.contents.find(x => x.isfolder && x.name.startsWith("caps_"));
    if (!dossierCaps) throw new Error("Aucun dossier caps_* trouve");
    
    const imagesPCloud = dossierCaps.contents.filter(x => x.contenttype && x.contenttype.startsWith("image/"));
    ecrire("   " + imagesPCloud.length + " image(s) trouvees sur pCloud", "info");
    
    ecrire("4. Verification de coherence log <-> pCloud...");
    const sansTimestamp = imagesPCloud.filter(img => !(img.name in tc));
    const sansImage = noms.filter(n => !imagesPCloud.find(img => img.name === n));
    
    if (sansTimestamp.length === 0 && sansImage.length === 0) {
      ecrire("   OK : correspondance parfaite", "ok");
    } else {
      if (sansTimestamp.length > 0) {
        ecrire("   " + sansTimestamp.length + " image(s) sans timestamp dans le log :", "err");
        sansTimestamp.slice(0, 5).forEach(img => ecrire("     " + img.name));
      }
      if (sansImage.length > 0) {
        ecrire("   " + sansImage.length + " timestamp(s) sans image dans pCloud :", "err");
        sansImage.slice(0, 5).forEach(n => ecrire("     " + n));
      }
    }
    
    ecrire("");
    ecrire("Echantillon (5 premieres images pCloud avec timestamp) :");
    imagesPCloud.slice(0, 5).forEach(img => {
      const t = tc[img.name];
      ecrire("  " + img.name + " -> " + (t !== undefined ? formaterTC(t) : "??"));
    });
    
  } catch (e) {
    ecrire("ERREUR : " + e.message, "err");
  }
}

test();
</script>
</body>
</html>
