<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Caps</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, sans-serif;
  margin: 0; padding: 0;
  background: #000; color: #fff;
}
header {
  padding: 0.5em 1em;
  background: #1a1a1a;
  font-size: 13px;
  position: sticky;
  top: 0; z-index: 10;
}
#status { color: #888; }
#grille {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px; padding: 2px;
}
.cell {
  position: relative;
  aspect-ratio: 1;
  background: #1a1a1a;
  overflow: hidden;
  cursor: pointer;
}
.cell img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.cell .nom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.7);
  font-size: 10px;
  padding: 2px 4px;
  text-align: center;
}
.cell .tc {
  position: absolute;
  top: 0; right: 0;
  background: rgba(0,0,0,0.7);
  font-size: 9px;
  padding: 2px 4px;
}
#player-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #000;
  z-index: 100;
  flex-direction: column;
}
#player-overlay.actif { display: flex; }
#player-overlay video {
  width: 100%; height: 100%;
  object-fit: contain;
  background: #000;
}
#player-overlay .barre {
  padding: 0.5em 1em;
  background: #1a1a1a;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}
#player-overlay button {
  background: rgba(255,255,255,0.15);
  border: none; color: #fff;
  padding: 0.4em 0.8em;
  border-radius: 6px;
  font-size: 14px;
}
</style>
</head>
<body>
<header>
  <div id="status">Chargement...</div>
</header>
<div id="grille"></div>

<div id="player-overlay">
  <div class="barre">
    <span id="player-info"></span>
    <button onclick="fermerPlayer()">Fermer</button>
  </div>
  <video id="player" playsinline controls preload="metadata"></video>
</div>

<script>
const CODE = "kZf66iZydKuIwvpnOJNRuYtpu244mXTHgPk";
const API = "https://eapi.pcloud.com";
const LOG_LOCAL = "log_caps_251010_09_58_Bel_Bien ensemble.txt";
const FETCH_OPTS = { referrerPolicy: "no-referrer" };

const statusEl = document.getElementById("status");
const grille = document.getElementById("grille");
const player = document.getElementById("player");
const playerOverlay = document.getElementById("player-overlay");
const playerInfo = document.getElementById("player-info");

function setStatus(s) { statusEl.textContent = s; }

function parserLog(texte) {
  const tc = {};
  const re = /(\S+\.(?:jpg|jpeg|png))\s+\(\d+x\d+px,\s*t=(?:(\d+)h)?(\d+)m(\d+)s/i;
  for (const ligne of texte.split('\n')) {
    const m = ligne.match(re);
    if (m) tc[m[1]] = (m[2] ? parseInt(m[2]) : 0) * 3600 + parseInt(m[3]) * 60 + parseInt(m[4]);
  }
  return tc;
}

function formaterTC(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}h${String(m).padStart(2,'0')}m${String(sec).padStart(2,'0')}s`;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function triNaturel(a, b) {
  const re = /(\d+)|(\D+)/g;
  const ta = a.match(re), tb = b.match(re);
  for (let i = 0; i < Math.min(ta.length, tb.length); i++) {
    const da = parseInt(ta[i]), db = parseInt(tb[i]);
    if (!isNaN(da) && !isNaN(db)) {
      if (da !== db) return da - db;
    } else {
      if (ta[i] !== tb[i]) return ta[i] < tb[i] ? -1 : 1;
    }
  }
  return ta.length - tb.length;
}

async function obtenirURLDirecte(fileid) {
  const r = await fetch(`${API}/getpublinkdownload?code=${CODE}&fileid=${fileid}`, FETCH_OPTS);
  const j = await r.json();
  if (j.result !== 0) throw new Error("getpublinkdownload result=" + j.result);
  return "https://" + j.hosts[0] + j.path;
}

let imagesData = [];
let videoFileid = null;
let videoURL = null;

async function init() {
  try {
    setStatus("Lecture du log et de pCloud...");
    
    // Lance les 2 requetes en parallele
    const [tcResp, j2] = await Promise.all([
      fetch(LOG_LOCAL).then(r => r.text()).then(parserLog),
      fetch(`${API}/showpublink?code=${CODE}`, FETCH_OPTS).then(r => r.json())
    ]);
    
    if (j2.result !== 0) throw new Error("showpublink result=" + j2.result);
    
    const videoFile = j2.metadata.contents.find(x => !x.isfolder && x.contenttype && x.contenttype.startsWith("video/"));
    if (!videoFile) throw new Error("Aucune video trouvee");
    videoFileid = videoFile.fileid;
    
    const dossierCaps = j2.metadata.contents.find(x => x.isfolder && x.name.startsWith("caps_"));
    const imagesPCloud = dossierCaps.contents
      .filter(x => x.contenttype && x.contenttype.startsWith("image/"))
      .sort((a, b) => triNaturel(a.name, b.name));
    
    imagesData = imagesPCloud.map(img => ({
      nom: img.name,
      fileid: img.fileid,
      tc: tcResp[img.name]
    }));
    
    // Cree d'abord toutes les cellules vides (affichage immediat de la structure)
    setStatus(imagesData.length + " images - chargement en cours...");
    const cells = [];
    for (const img of imagesData) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.innerHTML = `
        <div class="nom">${img.nom}</div>
        <div class="tc">${img.tc !== undefined ? formaterTC(img.tc) : '?'}</div>
      `;
      cell.addEventListener("click", () => lancerVideo(img));
      grille.appendChild(cell);
      cells.push(cell);
    }
    
    // Maintenant, lance TOUS les appels URL en parallele
    let chargees = 0;
    await Promise.all(imagesData.map(async (img, i) => {
      try {
        img.url = await obtenirURLDirecte(img.fileid);
        const im = document.createElement("img");
        im.src = img.url;
        im.loading = "lazy";
        cells[i].insertBefore(im, cells[i].firstChild);
        chargees++;
        if (chargees % 20 === 0 || chargees === imagesData.length) {
          setStatus(chargees + " / " + imagesData.length);
        }
      } catch (e) {
        cells[i].style.background = "#600";
      }
    }));
    
    setStatus(imagesData.length + " images");
    
  } catch (e) {
    setStatus("ERREUR : " + e.message);
  }
}

async function lancerVideo(img) {
  if (img.tc === undefined) {
    alert("Aucun timestamp pour " + img.nom);
    return;
  }
  
  playerInfo.textContent = img.nom + " — " + formaterTC(img.tc);
  playerOverlay.classList.add("actif");
  
  try {
    if (!videoURL) {
      videoURL = await obtenirURLDirecte(videoFileid);
    }
    if (player.src !== videoURL) {
      player.src = videoURL;
    }
    
    const seek = () => {
      player.currentTime = img.tc;
      player.pause();
    };
    
    if (player.readyState >= 1) {
      seek();
    } else {
      player.addEventListener("loadedmetadata", seek, { once: true });
    }
  } catch (e) {
    alert("Erreur video : " + e.message);
    fermerPlayer();
  }
}

function fermerPlayer() {
  player.pause();
  playerOverlay.classList.remove("actif");
}

init();
</script>
</body>
</html>
